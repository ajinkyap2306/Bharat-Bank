      <path d="M 6 4 L 18 4 C 23 4 27 7 27 12 C 27 16 24 19 20 20 C 25 21 28 25 28 30 C 28 36 23 40 17 40 L 6 40 Z" />
      <path d="M 24 20 L 32 20 C 37 20 41 24 41 29 C 41 34 37 38 32 38 L 22 38" />
