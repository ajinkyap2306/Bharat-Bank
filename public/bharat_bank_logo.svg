  </text>

  <!-- Red underline -->
  <line x1="125" y1="92" x2="525" y2="92" stroke="#D9252A" stroke-width="2.5" />

  <!-- Subtitle: MULTI-STATE SCHEDULED BANK -->
  <text x="145" y="112" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1B51A1" letter-spacing="4.5">
