    </g>
  </g>

  <!-- Typography -->
  <!-- Line 1: Bharat Co-operative -->
  <text x="145" y="44" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1B51A1" letter-spacing="-0.5">
    Bharat Co-operative
  </text>

  <!-- Line 2: Bank (Mumbai) Ltd -->
  <text x="145" y="82" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1B51A1" letter-spacing="-0.5">
