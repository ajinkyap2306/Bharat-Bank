    <!-- India Map Silhouette in Red -->
    <path d="M60 20 C63 20 66 23 65 27 C65 29 68 30 69 33 C71 36 73 35 75 38 C77 41 83 43 84 47 C85 51 82 54 81 57 C80 60 82 63 83 66 C83 69 80 71 81 74 C81 76 77 80 75 83 C73 86 68 89 66 92 C64 95 61 98 59 99 C58 96 56 92 54 88 C52 85 49 82 47 78 C44 73 42 68 41 63 C40 58 41 53 42 48 C43 43 44 39 47 35 C50 31 53 27 55 24 C57 22 59 20 60 20 Z" fill="#D9252A" />

